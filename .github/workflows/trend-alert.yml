name: Trend Alert — Telegram

on:
  schedule:
    # GitHub mínimo: cada 5 minutos (*/1 no está soportado)
    - cron: '*/5 * * * *'
  workflow_dispatch: # permite ejecutar manualmente desde GitHub

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    environment: github-pages
    runs-on: ubuntu-latest

    env:
      BINANCE_SYMBOL:    BTCUSDT   # par a monitorear
      ENTRY_TIMEFRAME:   15m       # timeframe de la señal de entrada
      CONTEXT_TIMEFRAME: 1h        # timeframe de confirmación (debe alinearse con la señal)
      MIN_SCORE:         4         # señales mínimas alineadas para enviar alerta (3-5)
      COOLDOWN_MINUTES:  60        # minutos mínimos entre alertas consecutivas
      STATE_FILE:        .trend-state.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore trend state (from previous run)
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: trend-state-${{ env.BINANCE_SYMBOL }}-${{ env.ENTRY_TIMEFRAME }}-${{ github.run_id }}
          restore-keys: |
            trend-state-${{ env.BINANCE_SYMBOL }}-${{ env.ENTRY_TIMEFRAME }}-

      - name: Check trend & send alert if changed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/check-trend.mjs

      - name: Save trend state (for next run)
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: trend-state-${{ env.BINANCE_SYMBOL }}-${{ env.ENTRY_TIMEFRAME }}-${{ github.run_id }}
